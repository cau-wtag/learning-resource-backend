services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: learningres-backend:latest
    container_name: learningres-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://learningres-db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - learning_app_net

networks:
  learning_app_net:
    name: learning_app_net
    external: true